# Development / runtime environment for forcefill.
#
#   conda env create -f environment.yml
#   conda activate forcefill
#   pip install -e . --no-deps
#
# AmberTools (antechamber, parmchk2 and the GAFF data files) is conda-only,
# which is why conda-forge is the recommended install route rather than pip.
name: forcefill

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python>=3.10
  - pip
  - openmm
  - parmed
  - ambertools
  # Optional at run time (forcefill imports them lazily), but installed here so
  # the test suite exercises the SMILES input and the SMIRNOFF backend rather
  # than skipping them. If conda-forge cannot solve these for a given Python,
  # drop them rather than pinning the rest of the environment back.
  - rdkit
  - openff-toolkit
  - openmmforcefields
  - pytest
  - pytest-cov
  - python-build
