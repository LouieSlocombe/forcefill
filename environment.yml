# Development / runtime environment for forcefill.
#
#   conda env create -f environment.yml
#   conda activate forcefill
#   pip install -e . --no-deps
#
# AmberTools (antechamber, parmchk2 and the GAFF data files) is conda-only, which
# is why conda-forge is the recommended route rather than pip; rdkit and the
# OpenFF packages are on PyPI but behave far better from conda-forge. This file is
# the supported way to get the whole stack.
name: forcefill

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python>=3.12
  - pip
  - openmm
  - parmed
  - ambertools
  # Imported at import time: rdkit for SMILES input and the ligand file readers,
  # the OpenFF pair for the smirnoff backend.
  - rdkit
  - openff-toolkit
  # 0.16 is the floor, not a preference: it is where smirnoff_filenames, a
  # multi-file forcefield= selection, and constraints and virtual sites in the
  # generated template arrive. The smirnoff backend does not work below it.
  - openmmforcefields>=0.16
  # backend="espaloma" additionally needs `espaloma`, deliberately left out
  # here: it pulls in PyTorch, and the other three backends never touch it.
  #   conda install -c conda-forge espaloma
  - pytest
  - pytest-cov
  - python-build
