# Development / runtime environment for forcefill.
#
#   conda env create -f environment.yml
#   conda activate forcefill
#   pip install -e . --no-deps
#
# AmberTools (antechamber, parmchk2 and the GAFF data files) is conda-only,
# which is why conda-forge is the recommended install route rather than pip.
# rdkit and the OpenFF packages are on PyPI but are far better behaved from
# conda-forge, so this file is the supported way to get the whole stack.
name: forcefill

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python>=3.10
  - pip
  - openmm
  - parmed
  - ambertools
  # Imported by forcefill at import time: rdkit for SMILES input and the ligand
  # file readers, the OpenFF pair for the smirnoff backend.
  - rdkit
  - openff-toolkit
  - openmmforcefields
  - pytest
  - pytest-cov
  - python-build
