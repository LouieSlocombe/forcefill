[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "forcefill"
# The single source of truth for the version: forcefill/__init__.py and
# docs/conf.py read it back through the installed metadata rather than repeating
# it. Bump it here, add the CHANGELOG.md entry, then tag `v<version>` —
# .github/workflows/release.yml refuses to publish unless the three agree.
# Bump on any API-visible change even between releases: consumers that install
# this repo from git HEAD carry no other staleness signal.
version = "1.0.0"
description = "Parameterize non-standard PDB residues (ligands, cofactors) into OpenMM force-field XML with AmberTools GAFF/AM1-BCC, OpenFF Sage or CHARMM CGenFF"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]
requires-python = ">= 3.12"
dependencies = [
    # All required at import time. conda-forge is the recommended install route:
    # the AmberTools executables the gaff backend calls (antechamber, parmchk2)
    # are conda-only, and rdkit and the OpenFF packages behave far better from
    # conda-forge than from PyPI.
    "openmm >= 7.6",
    "parmed >= 3.4",
    # SMILES input, and the file readers behind the preflight checks.
    "rdkit",
    # The smirnoff backend.
    "openff-toolkit >= 0.16",
    "openmmforcefields >= 0.16",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    # The floor is requires-python; the ceiling is what CI actually runs.
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
    # Backs the py.typed marker in package-data below.
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
# Pinned, not floating: ruff's formatter output shifts between releases, so this
# must match .pre-commit-config.yaml and .github/workflows/ci.yml or a locally
# clean tree can still fail the CI format gate.
dev = ["ruff == 0.16.2", "pre-commit"]

[project.urls]
Homepage = "https://github.com/LouieSlocombe/forcefill"
Repository = "https://github.com/LouieSlocombe/forcefill"
Documentation = "https://forcefill.readthedocs.io"
Changelog = "https://github.com/LouieSlocombe/forcefill/blob/main/CHANGELOG.md"
Issues = "https://github.com/LouieSlocombe/forcefill/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["forcefill*"]

# Non-Python files shipped in wheels: the PEP 561 typing marker. Test fixtures
# stay in the source repository under tests/data/ — run the suite from a checkout.
# The sdist is MANIFEST.in, which says the same thing for the same reason.
[tool.setuptools.package-data]
forcefill = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: runs the real AmberTools executables (antechamber/parmchk2); deselect with -m 'not integration'",
    "smirnoff: runs real OpenFF parameterization (slow); deselect with -m 'not smirnoff'",
    "espaloma: runs the real espaloma model (needs the optional espaloma package and, on first use, a model download); deselect with -m 'not espaloma'",
]

# Coverage is measured with `pytest --cov`; configured here so local runs and CI
# report the same numbers. The tests live outside the package, so they fall
# outside `source` and need no explicit omit.
[tool.coverage.run]
source = ["forcefill"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
]

# `ruff format` owns layout, `ruff check` what the formatter cannot express. Both
# gate CI (.github/workflows/ci.yml) and run as pre-commit hooks
# (.pre-commit-config.yaml); the version is pinned there, here and in the `dev`
# extra above — keep the three in step.
[tool.ruff]
line-length = 120
target-version = "py312"

# ruff's current defaults, pinned so that a future release which changes one
# cannot silently reformat the whole tree.
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "PIE", "SIM", "RUF", "FURB",
    "PLE", "PLW", "BLE", "T20", "G", "LOG",
    # Docstring shape, Google convention (configured below); *presence* is not
    # checked — see the D1xx ignores.
    "D",
    # Consistency guards: each was at zero violations when adopted, so they cost
    # nothing and stop the styles they forbid creeping back in.
    "ICN", "TID", "PYI", "RSE", "FA", "PGH", "DTZ", "EXE", "INT", "ISC", "ERA",
    "PLR2044",
    # Redundancy the formatter cannot see: `else` after `return`/`raise`, assign-
    # then-return, manual list-building loops, and similar.
    "RET", "PERF", "PLR1714", "PLR5501", "PLR1711", "PLC1802",
]
ignore = [
    # Docstring presence is not enforced: the public API is documented already,
    # and requiring one on every test function and tiny private helper would add
    # noise, not information.
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    # On ruff's own formatter-incompatible list. Implicit concatenation across
    # lines is how the long error-message templates stay under line-length.
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
# The runnable examples talk to the user through print().
"examples/*" = ["T20"]
# The release helpers hand their result to the workflow shell on stdout; print()
# is their interface, not debugging left behind.
".github/*.py" = ["T20"]
# Sphinx's conf.py is a settings file, and `copyright` is a name Sphinx requires
# that happens to shadow the builtin.
"docs/conf.py" = ["A001"]

[tool.ruff.lint.isort]
known-first-party = ["forcefill"]

[tool.ruff.lint.pydocstyle]
convention = "google"
