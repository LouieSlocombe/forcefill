[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "forcefill"
version = "0.0.0"
description = "Parameterize non-standard PDB residues (ligands, cofactors) into OpenMM force-field XML with AmberTools GAFF/AM1-BCC and ParmEd"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]
requires-python = ">= 3.10"
dependencies = [
    # Both are required at import time. conda-forge is the recommended install
    # route for the full stack: the AmberTools executables (antechamber,
    # parmchk2) that do the actual parameterization are conda-only.
    "openmm >= 7.6",
    "parmed >= 3.4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
# Pinned, not floating: ruff's formatter output can shift between releases, so the
# version here must match .pre-commit-config.yaml and .github/workflows/ci.yml or
# a locally-clean tree can still fail the CI format gate.
dev = ["ruff == 0.16.2", "pre-commit"]
# Optional ligand features, both imported lazily so the base install never needs
# them. rdkit: SMILES input and the more robust file readers. smirnoff: the
# OpenFF backend (backend="smirnoff"). conda-forge is the better route for both,
# for the same reason it is for openmm — see environment.yml.
rdkit = ["rdkit"]
smirnoff = ["openff-toolkit >= 0.16", "openmmforcefields >= 0.14"]
all = ["rdkit", "openff-toolkit >= 0.16", "openmmforcefields >= 0.14"]

[project.urls]
Homepage = "https://github.com/LouieSlocombe/forcefill"
Repository = "https://github.com/LouieSlocombe/forcefill"

[tool.setuptools.packages.find]
where = ["."]
include = ["forcefill*"]

# Non-Python files shipped in wheels: the PEP 561 typing marker. Test fixtures
# stay in the source repository under tests/data/ — run the suite from a checkout.
[tool.setuptools.package-data]
forcefill = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: runs the real AmberTools executables (antechamber/parmchk2); deselect with -m 'not integration'",
    "smirnoff: needs openff-toolkit and openmmforcefields; deselect with -m 'not smirnoff'",
]

# Coverage is measured with `pytest --cov`; the config lives here so local runs
# and CI report the same numbers. The tests live outside the package, so they
# fall outside `source` and need no explicit omit.
[tool.coverage.run]
source = ["forcefill"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
]

# Style is machine-enforced end to end: `ruff format` owns layout, `ruff check` owns
# what the formatter cannot express. Both gate CI (.github/workflows/ci.yml) and run
# as pre-commit hooks (.pre-commit-config.yaml); the ruff version is pinned in all
# three places and in the `dev` extra above — keep them in step.
[tool.ruff]
line-length = 120
target-version = "py310"

# These are ruff's current defaults, so pinning them changes nothing today. The
# section exists so that a future ruff release which changes a default cannot
# silently reformat the whole tree.
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "PIE", "SIM", "RUF", "FURB",
    "PLE", "PLW", "BLE", "T20", "G", "LOG",
    # Docstring shape, Google convention (configured below). Docstring *presence*
    # is deliberately not checked here — see the D1xx ignores.
    "D",
    # Consistency guards: each was at zero violations when adopted, so they cost
    # nothing to keep and stop the styles they forbid from creeping back in.
    "ICN", "TID", "PYI", "RSE", "FA", "PGH", "DTZ", "EXE", "INT", "ISC", "ERA",
    "PLR2044",
    # Redundancy the formatter cannot see: `else` after `return`/`raise`, assign-
    # then-return, manual list-building loops, and similar.
    "RET", "PERF", "PLR1714", "PLR5501", "PLR1711", "PLC1802",
]
ignore = [
    # Docstring presence is not enforced wholesale: the public API is fully
    # documented already; requiring docstrings on every test function and tiny
    # private helper would add noise, not information.
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    # On ruff's own formatter-incompatible list. Implicit concatenation across
    # lines is how the long error-message templates stay under line-length.
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
# The runnable examples talk to the user through print().
"examples/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["forcefill"]

[tool.ruff.lint.pydocstyle]
convention = "google"
